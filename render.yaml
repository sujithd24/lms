services:
  - type: web
    name: lms-server
    runtime: node
    region: oregon
    plan: free
    rootDir: server
    buildCommand: npm install --legacy-peer-deps && npm run build
    startCommand: node dist/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      # MongoDB Atlas connection string (required), e.g.
      # mongodb+srv://<user>:<password>@<cluster>.mongodb.net/lms?retryWrites=true&w=majority
      - key: MONGODB_URI
        sync: false
      # "true" loads the sample courses, but only into an EMPTY database
      - key: SEED_ON_START
        sync: false
      # AWS is now only used for S3 video uploads
      - key: AWS_REGION
        sync: false
      - key: AWS_ACCESS_KEY
        sync: false
      - key: AWS_SECRET_KEY
        sync: false
      - key: S3_BUCKET_NAME
        sync: false
      - key: CLOUDFRONT_DOMAIN
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false

  - type: web
    name: lms-client
    runtime: node
    region: oregon
    plan: free
    rootDir: client
    buildCommand: npm install --legacy-peer-deps --include=dev && npm run build
    startCommand: npx next start -p $PORT
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_BASE_URL
        sync: false
      - key: NEXT_PUBLIC_STRIPE_PUBLIC_KEY
        sync: false
      - key: NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      - key: NEXT_PUBLIC_RAPIDAPI_KEY
        sync: false
      # Demo login buttons on /signin and /signup (hidden when unset).
      # Read at runtime by /api/demo-accounts: a restart applies changes, no rebuild needed.
      # (The older NEXT_PUBLIC_DEMO_* names are accepted too.)
      - key: DEMO_STUDENT_PASSWORD
        sync: false
      - key: DEMO_TEACHER_PASSWORD
        sync: false
